name: Monthly refresh

on:
  schedule:
    - cron: "0 6 5 * *"   # 5th of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Extract, build and test, publish
        run: python -m pipeline all --refresh
        env:
          DBT_SEND_ANONYMOUS_USAGE_STATS: "False"
      - name: Commit the refreshed export
        run: |
          git config user.name "connected-world bot"
          git config user.email "actions@users.noreply.github.com"
          git add exports/
          git diff --cached --quiet || git commit -m "Monthly data refresh $(date -u +%Y-%m-%d)"
          git push
