version: 2
models:
  - name: int_football__elo
    description: Match-level Elo ratings for FIFA-recognised teams (Python model).
    columns:
      - name: team_code
        tests: [not_null]
      - name: rating_after
        tests:
          - between: {arguments: {min_value: 500, max_value: 3000}}
  - name: int_football__current_ratings
    columns:
      - name: team
        tests: [unique, not_null]
  - name: int_olympics__country_medals
    columns:
      - name: iso3
        tests:
          - unique
          - not_null
          - relationships: {arguments: {to: ref('dim_country'), field: iso3}}
  - name: int_passports__scores
    columns:
      - name: iso3
        tests: [unique, not_null]
      - name: passport_power
        tests:
          - between: {arguments: {min_value: 0, max_value: 230}}
  - name: int_country_latest
    columns:
      - name: iso3
        tests:
          - relationships: {arguments: {to: ref('dim_country'), field: iso3}}
